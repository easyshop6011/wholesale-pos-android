name: Build Wholesale POS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract ZIP
        run: unzip wholesale-pos-saas-phase3a.zip -d source

      - name: Install dependencies
        working-directory: source/wholesale-pos
        run: npm install

      - name: Setup Android project
        working-directory: source/wholesale-pos
        run: npm run android:setup

      - name: Build APK
        working-directory: source/wholesale-pos
        run: npm run android:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wholesale-POS-APK
          path: source/wholesale-pos/android/app/build/outputs/apk/debug/app-debug.apk
          
